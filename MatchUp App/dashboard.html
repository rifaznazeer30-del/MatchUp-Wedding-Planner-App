<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matchup - Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <div class="dashboard-screen">

        <!-- HEADER -->
        <div class="dashboard-header">

            <button class="menu-button">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="welcome">
                <h1>Hello, David! 👋</h1>
                <p>Let's plan your perfect wedding</p>
            </div>

            <button class="notification-button">
                <i class="fa-regular fa-bell"></i>
            </button>

        </div>


        <!-- MAIN CONTENT -->
        <div class="dashboard-content">

            <!-- Budget -->
            <a href="budget.html" class="dashboard-card">

                <img src="Images/budget.svg" class="dashboard-icon" alt="Budget">

                <h3>Budget</h3>

                <strong>Rs. 800,000</strong>

                <p>Remaining</p>

            </a>


            <!-- Guest List -->
            <div class="dashboard-card">

                <img src="Images/guest-list.svg" class="dashboard-icon" alt="Guest List">

                <h2>Guest List</h2>

                <strong>120</strong>

                <p>Guests</p>

            </div>


            <!-- Checklist -->
            <div class="dashboard-card">

                <img src="Images/checklist.svg" class="dashboard-icon" alt="Checklist">

                <h2>Checklist</h2>

                <strong>12 / 20</strong>

                <p>Tasks Completed</p>

            </div>


            <!-- Vendors -->
            <div class="dashboard-card">

                <img src="Images/vendors.svg" class="dashboard-icon" alt="Vendors">

                <h2>Vendors</h2>

                <strong>8</strong>

                <p>Booked</p>

            </div>


            <!-- Calendar Event -->
            <div class="next-event">

                <div class="calendar-icon">
                    <img src="Images/calendar.svg" class="calendar-icon-img" alt="Calendar">
                </div>

                <div class="event-details">

                    <h3>Calendar</h3>

                    <span>Next Event</span>

                    <strong>Dress Fitting</strong>

                    <small>12 Aug 2026</small>

                </div>

                <i class="fa-solid fa-chevron-right event-arrow"></i>

            </div>


            <!-- AI Assistant -->
            <button class="ai-assistant">

                <img src="Images/ai-assistant.svg" class="ai-icon" alt="AI Assistant">

                <span>AI Wedding Assistant</span>

            </button>

        </div>


        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-navigation">

            <button class="nav-item active">
                <img src="Images/home.svg" alt="Home">
                <span>Home</span>
            </button>

            <button class="nav-item">
                <img src="Images/tasks.svg" alt="Tasks">
                <span>Tasks</span>
            </button>

            <button class="nav-item">
                <img src="Images/bottom-calendar.svg" alt="Calendar">
                <span>Calendar</span>
            </button>

            <button class="nav-item">
                <img src="Images/profile.svg" alt="Profile">
                <span>Profile</span>
            </button>

        </div>

    </div>

</body>

</html>
