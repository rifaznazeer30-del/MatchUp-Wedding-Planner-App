<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matchup - Plan Your Dream Wedding</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="splash-screen">

        <!-- Wedding Image -->
        <div class="wedding-image">
            <img src="Images/Wedding pic.jpg" alt="Wedding">
        </div>

        <!-- Bottom Content -->
        <div class="content">

            <!-- Matchup Logo -->
            <img 
                class="matchup-logo" 
                src="Images/Matchup Text.svg" 
                alt="Matchup"
            >

            <button id="getStarted">
                Get Started
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
